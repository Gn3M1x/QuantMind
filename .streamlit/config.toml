[theme]
base = "light"
primaryColor = "#435F53"
backgroundColor = "#F6F5F0"
secondaryBackgroundColor = "#ECEDE5"
textColor = "#293C35"
borderColor = "#DDDFD4"
font = "sans serif"
baseFontSize = 14
baseRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
primaryColor = "#435F53"
backgroundColor = "#EEEEE6"
secondaryBackgroundColor = "#F9F9F4"

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
