[theme]
base = "dark"
primaryColor = "#5B8DEF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111827"
textColor = "#E5E7EB"
borderColor = "#263244"
font = "sans serif"
baseFontSize = 14
baseRadius = "0.625rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
primaryColor = "#5B8DEF"
backgroundColor = "#0E1726"
secondaryBackgroundColor = "#111827"

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
